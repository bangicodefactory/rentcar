name: CI

on:
  push:
    branches: [feat/modernization, dev, main]
  pull_request:
    branches: [feat/modernization, dev, main]
  workflow_dispatch:
  # Reusable: deploy.yml calls this suite as its release gate, so a tag can
  # only ship after the full per-client matrix is green on that exact SHA.
  workflow_call:

jobs:
  test:
    name: Test (PHP ${{ matrix.php }} / ${{ matrix.client }} / ${{ matrix.db.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        client: [directonderweg]   # extend as clients onboard
        php: ['8.4']
        # Prod hosts run MariaDB (whose default engine is MyISAM — hence the
        # engine=InnoDB pin in config/database.php); CI historically only tested
        # MySQL, so MariaDB-only breakage (e.g. silently-dropped FKs) slipped by.
        # health differs: MariaDB 11.x dropped the mysqladmin symlink, so it uses
        # the image's healthcheck.sh; MySQL keeps mysqladmin ping.
        db:
          - { image: 'mysql:8.0',    name: mysql,   health: 'mysqladmin ping' }
          - { image: 'mariadb:11.4', name: mariadb, health: 'healthcheck.sh --connect --innodb_initialized' }

    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6
          --health-start-period=60s

    env:
      APP_ENV: testing
      APP_CLIENT: ${{ matrix.client }}
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
      SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_ENVIRONMENT: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, bcmath, exif, pcntl, zip
          # Use Xdebug for coverage: a runner PHP 8.4 patch bump regressed pcov
          # so it reports "enabled" at setup but PHPUnit sees "No coverage driver
          # detected" at runtime (→ 0% → the --min=80 gate fails on every PR).
          # Xdebug is detected reliably; slower, but coverage runs once per job.
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Copy .env
        run: cp .env.example .env

      - name: Create storage directories
        run: |
          mkdir -p storage/framework/{cache/data,sessions,views}
          mkdir -p storage/logs
          chmod -R 755 storage

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Seed client branding (idempotent)
        run: php artisan client:install

      - name: Run tests with coverage
        # Force Xdebug into coverage mode at runtime. setup-php sets
        # xdebug.mode=coverage in php.ini, but the runner's XDEBUG_MODE env var
        # overrides the ini and (mid image-rollout) intermittently leaves it
        # unset → "Unable to get coverage using Xdebug" → 0% → gate fails. The
        # explicit env makes coverage deterministic across all runners.
        env:
          XDEBUG_MODE: coverage
        run: php artisan test --coverage --min=80

      - name: Frontend tests (Vitest)
        run: npm test
