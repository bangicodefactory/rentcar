name: CI

on:
  push:
    branches: [feat/modernization, dev, main]
  pull_request:
    branches: [feat/modernization, dev, main]

jobs:
  test:
    name: Test (PHP ${{ matrix.php }} / ${{ matrix.client }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        client: [directonderweg]   # extend as clients onboard
        php: ['8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --health-start-period=30s

    env:
      APP_ENV: testing
      APP_CLIENT: ${{ matrix.client }}
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, bcmath, exif, pcntl, zip
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run tests with coverage
        # --min=0 until Phase 1 test backfill raises coverage to 80%; restore --min=80 then
        run: php artisan test --coverage --min=0

      # post-Phase 5 — uncomment when React/TypeScript port is complete
      # - name: TypeScript type-check
      #   run: npm run type-check
      # - name: Frontend tests (Vitest)
      #   run: npm test --if-present
